[workspace]
resolver = "3"
members = [
    "crates/recipe-core",
    "crates/recipe-db",
    "crates/recipe-scraper",
    "crates/recipe-mcp",
    "crates/node-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/watchcat/chefsprodigy"

[workspace.dependencies]
# Internal crates
recipe-core = { path = "crates/recipe-core" }
recipe-db = { path = "crates/recipe-db" }
recipe-scraper = { path = "crates/recipe-scraper" }
recipe-mcp = { path = "crates/recipe-mcp" }

# Async runtime & web
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "signal"] }
axum = { version = "0.8", features = ["multipart", "json", "query"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json", "chrono"] }

# AI & structured extraction
rig-core = { version = "0.45", features = ["derive", "reqwest"] }
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# MCP
rmcp = { version = "3.6", features = ["server", "transport-io", "transport-streamable-http-server"] }

# Scraping
scraper = "0.29"
htmd = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "charset", "http2"] }

# Images & archives
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }

# IDs & hashing
ulid = "3.0"
sha2 = "0.11"

# Errors, logging, CLI, time
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
rust-embed = { version = "8.13", features = ["include-exclude", "debug-embed"] }
mime_guess = "2.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
