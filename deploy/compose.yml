# Base stack for one VPS behind Cloudflare (docs/SPEC-hosted-platform.md section 3).
# hubctl copies this file into the deployment root next to the generated
# compose.hubs.yml and runs `docker compose -f compose.yml -f compose.hubs.yml`.
# platform (RN-69) and the provisioner (RN-73) join this file when they ship; hubs
# live in compose.hubs.yml.
name: chefslegacy

services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.11-alpine
    container_name: caddy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      CADDY_INGRESS_NETWORKS: chefs_net
      CADDY_DOCKER_CADDYFILE_PATH: /etc/caddy/Caddyfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks: [chefs_net]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # LLM gateway (docs/SPEC-hosted-platform.md section 5.2): hubs call it on chefs_net with
  # their hub token; it holds the vendor keys. The admin API is published on loopback only,
  # for hubctl. Same image as the hubs, different entrypoint.
  llm-gateway:
    image: ${HUB_IMAGE:-ghcr.io/watchcat/chefsprodigy:latest}
    container_name: llm-gateway
    entrypoint: ["/usr/local/bin/llm-gateway"]
    command: ["serve"]
    environment:
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MINIMAX_ANTHROPIC_API_BASE: ${MINIMAX_ANTHROPIC_API_BASE:-https://api.minimax.io/anthropic}
      TOKIO_WORKER_THREADS: "2"
    ports:
      - "127.0.0.1:${GATEWAY_ADMIN_PORT:-8090}:8080"
    volumes: ["./gateway/data:/data"]
    networks: [chefs_net]
    mem_limit: 64m
    cpus: "0.5"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/llm-gateway", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  # Caddy, hubs, llm-gateway and platform. Hubs need outbound internet (recipe pages,
  # model vendor), so this one is not internal.
  chefs_net:
    name: chefs_net
  # platform and provisioner only (phase 3). Internal: no route in or out.
  control_net:
    name: control_net
    internal: true
