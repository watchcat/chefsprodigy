# Generated by `deploy/hubctl render --reference deploy/k8s` for DOMAIN=chefslegacy.com, TLS_MODE=origin.
# `hubctl init` and `hubctl create` apply these same objects; edit deploy/hubctl, not this file.
# deploy/tests fails when the checked-in copy drifts from hubctl.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub-backup
  namespace: chefs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-secrets-reader
  namespace: chefs-hubs
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-backup-reads-secrets
  namespace: chefs-hubs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hub-secrets-reader
subjects:
  - kind: ServiceAccount
    name: hub-backup
    namespace: chefs-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-backup-script
  namespace: chefs-system
data:
  fetch.sh: |
    #!/bin/sh
    # Export every hub (or those in $HUBS) through its owner key into /work; see spec 4.7.
    set -u
    STAMP=$(date -u +%Y%m%dT%H%M%SZ)
    rm -f /work/.failed
    kubectl -n chefs-hubs get secret -l app=hub -o json \
      | jq -r '.items[] | "\(.metadata.labels.hub) \(.data.NODE_API_KEY)"' \
      | while read -r name key_b64; do
          if [ -n "${HUBS:-}" ]; then
            case " $HUBS " in *" $name "*) ;; *) continue ;; esac
          fi
          key=$(printf '%s' "$key_b64" | base64 -d)
          out="/work/hubs/$name/$name-$STAMP.zip"
          mkdir -p "/work/hubs/$name"
          code=$(curl -sS -o "$out" -w '%{http_code}' -H "Authorization: Bearer $key" \
            "http://hub-$name.chefs-hubs.svc:8080/api/v1/export" || echo 000)
          case "$code" in
            200) echo "hub $name: exported $(wc -c < "$out") bytes" ;;
            404) echo "hub $name: export endpoint not available yet (RN-30); skipped"; rm -f "$out" ;;
            *)   echo "hub $name: export failed with HTTP $code"; rm -f "$out"; echo "$name" >> /work/.failed ;;
          esac
        done
    if [ -f /work/.failed ]; then echo "failed hubs: $(tr '\n' ' ' < /work/.failed)"; exit 1; fi
    echo "fetch done"
  upload.sh: |
    #!/bin/sh
    # Upload /work to the R2 bucket named by the backup-r2 secret (rclone env config).
    set -u
    if [ -z "${RCLONE_CONFIG_R2_TYPE:-}" ]; then
      echo "R2 not configured (no backup-r2 secret); archives stay in the job volume"
      exit 0
    fi
    n=$(find /work -name '*.zip' | wc -l)
    if [ "$n" -eq 0 ]; then echo "nothing to upload"; exit 0; fi
    rclone copy /work "r2:${R2_BUCKET}" --s3-no-check-bucket && echo "uploaded $n archive(s) to r2:${R2_BUCKET}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hub-backup
  namespace: chefs-system
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: hub-backup
            role: hub-client
        spec:
          serviceAccountName: hub-backup
          restartPolicy: Never
          initContainers:
            - name: fetch
              image: "alpine/k8s:1.31.3"
              command:
                - sh
                - /scripts/fetch.sh
              env:
                - name: HUBS
                  value: ""
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
          containers:
            - name: upload
              image: "rclone/rclone:1.68.2"
              command:
                - sh
                - /scripts/upload.sh
              env:
                - name: HUBS
                  value: ""
              envFrom:
                - secretRef:
                    name: backup-r2
                    optional: true
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: work
              emptyDir: {}
            - name: scripts
              configMap:
                name: hub-backup-script
