# Generated by `deploy/hubctl render --reference deploy/k8s` for DOMAIN=chefslegacy.com, TLS_MODE=origin.
# `hubctl init` and `hubctl create` apply these same objects; edit deploy/hubctl, not this file.
# deploy/tests fails when the checked-in copy drifts from hubctl.
apiVersion: v1
kind: Secret
metadata:
  name: platform-env
  namespace: chefs-system
  labels:
    app: platform
type: Opaque
stringData:
  PLATFORM_ADMIN_TOKEN: "<copied from .env by hubctl init>"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-data
  namespace: chefs-system
  labels:
    app: platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  namespace: chefs-system
  labels:
    app: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: platform
  template:
    metadata:
      labels:
        app: platform
        role: hub-client
      annotations:
        chefsprodigy/env-checksum: "030f97fdde3314b9"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform
          image: "ghcr.io/watchcat/chefsprodigy:latest"
          command:
            - /usr/local/bin/platform
          args:
            - serve
          env:
            - name: PLATFORM_PORT
              value: "8080"
            - name: PLATFORM_DATA_DIR
              value: /data
            - name: TOKIO_WORKER_THREADS
              value: "2"
          envFrom:
            - secretRef:
                name: platform-env
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: platform
  namespace: chefs-system
  labels:
    app: platform
spec:
  selector:
    app: platform
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  namespace: chefs-system
  labels:
    app: platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: "chefs-system-headers@kubernetescrd"
spec:
  rules:
    - host: chefslegacy.com
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: platform
                port:
                  number: 8080
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: platform
                port:
                  number: 8080
          - path: /api/v1/search
            pathType: Prefix
            backend:
              service:
                name: platform
                port:
                  number: 8080
          - path: /api/v1/hubs
            pathType: Prefix
            backend:
              service:
                name: platform
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: platform
                port:
                  number: 8080
  tls:
    - hosts:
        - chefslegacy.com
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-ingress
  namespace: chefs-system
spec:
  podSelector:
    matchLabels:
      app: platform
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
