# Generated by `deploy/hubctl render --reference deploy/k8s` for DOMAIN=chefslegacy.com, TLS_MODE=origin.
# `hubctl init` and `hubctl create` apply these same objects; edit deploy/hubctl, not this file.
# deploy/tests fails when the checked-in copy drifts from hubctl.
apiVersion: v1
kind: Secret
metadata:
  name: llm-gateway-env
  namespace: chefs-system
  labels:
    app: llm-gateway
type: Opaque
stringData:
  MINIMAX_API_KEY: "<copied from .env by hubctl init>"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-gateway-data
  namespace: chefs-system
  labels:
    app: llm-gateway
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: chefs-system
  labels:
    app: llm-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
      annotations:
        chefsprodigy/env-checksum: c83dd514542f9154
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "ghcr.io/watchcat/chefsprodigy:latest"
          command:
            - /usr/local/bin/llm-gateway
          args:
            - serve
          env:
            - name: GATEWAY_PORT
              value: "8080"
            - name: GATEWAY_DATA_DIR
              value: /data
            - name: TOKIO_WORKER_THREADS
              value: "2"
          envFrom:
            - secretRef:
                name: llm-gateway-env
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "24Mi"
            limits:
              cpu: "500m"
              memory: "64Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: llm-gateway-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: chefs-system
  labels:
    app: llm-gateway
spec:
  selector:
    app: llm-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-gateway-ingress
  namespace: chefs-system
spec:
  podSelector:
    matchLabels:
      app: llm-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chefs-hubs
          podSelector:
            matchLabels:
              app: hub
      ports:
        - protocol: TCP
          port: 8080
