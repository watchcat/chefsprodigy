# Generated by `deploy/hubctl render --reference deploy/k8s` for DOMAIN=chefslegacy.com, TLS_MODE=origin.
# `hubctl init` and `hubctl create` apply these same objects; edit deploy/hubctl, not this file.
# deploy/tests fails when the checked-in copy drifts from hubctl.
# Example hub `jacob`: what `hubctl render jacob` prints before the hub exists.
apiVersion: v1
kind: Secret
metadata:
  name: hub-jacob-env
  namespace: chefs-hubs
  labels:
    app: hub
    hub: jacob
type: Opaque
stringData:
  NODE_API_KEY: "<generated by hubctl create>"
  NODE_CHEF_NAME: Jacob
  NODE_PUBLIC_URL: "https://jacob.chefslegacy.com"
  NODE_HOST: "0.0.0.0"
  NODE_PORT: "8080"
  NODE_DATA_DIR: /data
  LLM_MODEL: minimax/MiniMax-M3
  MINIMAX_API_KEY: "<vendor key copied from .env until llm-gateway issues hub tokens (RN-66)>"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hub-jacob
  namespace: chefs-hubs
  labels:
    app: hub
    hub: jacob
spec:
  serviceName: hub-jacob
  replicas: 1
  selector:
    matchLabels:
      app: hub
      hub: jacob
  template:
    metadata:
      labels:
        app: hub
        hub: jacob
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node
          image: "ghcr.io/watchcat/chefsprodigy:latest"
          args:
            - serve
          env:
            - name: TOKIO_WORKER_THREADS
              value: "2"
          envFrom:
            - secretRef:
                name: hub-jacob-env
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: hub-jacob
  namespace: chefs-hubs
  labels:
    app: hub
    hub: jacob
spec:
  selector:
    app: hub
    hub: jacob
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub-jacob
  namespace: chefs-hubs
  labels:
    app: hub
    hub: jacob
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: "chefs-system-headers@kubernetescrd"
spec:
  rules:
    - host: jacob.chefslegacy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hub-jacob
                port:
                  number: 8080
  tls:
    - hosts:
        - jacob.chefslegacy.com
