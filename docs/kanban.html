<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Node Board</title>
<style>
:root{--bg:#f4f2ec;--panel:#ffffff;--ink:#1f2a26;--muted:#66736e;--line:#e2ded4;--accent:#173f36;--chip:#eef3f0;
 --backlog:#9a7b2f;--in-progress:#2b6cb0;--review:#8a4fb5;--done:#2f855a;--code:#f0ede5;--ok:#2f855a;--err:#c53030}
@media (prefers-color-scheme:dark){:root{--bg:#141817;--panel:#1d2321;--ink:#e8ebe9;--muted:#9aa7a1;--line:#2d3633;--accent:#8fd1bd;--chip:#26302d;--code:#262d2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:baseline;padding:20px 24px 8px}
header.top h1{margin:0;font-size:22px;letter-spacing:-.01em}
header.top .meta{color:var(--muted);font-size:13px}
header.top input{margin-left:auto;min-width:220px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.board{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:16px;padding:12px 24px 32px}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(260px,1fr))}}
@media (max-width:640px){.board{grid-template-columns:1fr;padding:12px 16px 24px}header.top{padding:16px}}
.col{background:color-mix(in srgb,var(--panel) 70%,var(--bg));border:1px solid var(--line);border-radius:12px;padding:12px;min-height:200px;transition:background .15s}
.col.over{background:color-mix(in srgb,var(--c) 10%,var(--bg));border-color:var(--c)}
.col h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px;padding-left:10px;border-left:3px solid var(--c)}
.col-backlog{--c:var(--backlog)}.col-in-progress{--c:var(--in-progress)}.col-review{--c:var(--review)}.col-done{--c:var(--done)}
.count{background:var(--chip);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.cards{display:flex;flex-direction:column;gap:10px;min-height:60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card[draggable=true]{cursor:grab}.card.dragging{opacity:.4}.card.drop-before{box-shadow:0 -3px 0 0 var(--c)}.card.drop-after{box-shadow:0 3px 0 0 var(--c)}
.card header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card .id{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--c)}
.size{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--muted)}
.size-L{background:#fde8e8;color:#9b2c2c}.size-M{background:#fdf3d9;color:#8a5a00}.size-S{background:#e3f6ea;color:#276749}
@media (prefers-color-scheme:dark){.size-L{background:#4a2323;color:#f8b4b4}.size-M{background:#473a14;color:#f6d47a}.size-S{background:#1f3d2b;color:#9ae6b4}}
.card h3{margin:0 0 6px;font-size:15px;line-height:1.3}
.card p{margin:0 0 6px;color:var(--muted);font-size:13.5px}
.col-done .card p{display:none}.col-done .card{padding:9px 12px}.col-done .card h3{font-size:14px;margin:0}
details{margin-top:6px;font-size:13px}summary{cursor:pointer;color:var(--accent);font-weight:600}
details ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code);padding:1px 5px;border-radius:4px}
.empty{color:var(--muted);font-style:italic;font-size:13px;margin:4px 0}
.card.hidden{display:none}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}#toast.err{background:var(--err);color:#fff}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--muted)}
.badge.live{background:#e3f6ea;color:#276749}
</style>
</head>
<body>
<header class="top">
  <h1>Recipe Node Board</h1>
  <span class="badge" id="mode"></span>
  <span class="meta" id="meta"></span>
  <input type="search" id="q" placeholder="Filter stories…" aria-label="Filter stories">
</header>
<main class="board" id="board"></main>
<div id="toast" role="status"></div>
<script>
const LIVE = false;
let board = {"columns": [{"name": "Backlog", "stories": [{"id": "RN-67", "title": "Hub: model quota-exceeded mapping", "size": "S", "body": ["Gateway 429/402 surfaces as a readable `model_quota_exceeded` error (HTTP 429) instead of a generic model failure."], "acceptance": ["API test with a fake extractor returning the gateway's error."]}, {"id": "RN-68", "title": "llm-gateway v2: quotas, cache, admin API", "size": "M", "body": ["Daily/monthly quotas, deterministic-reply cache, admin endpoints and BYOK per spec \u00a75.2."], "acceptance": ["over-quota request gets 429 before any upstream call; a repeated label request is a cache hit; admin API tested."]}, {"id": "RN-75", "title": "Seeded `canonical_terms` dictionary", "size": "S", "body": ["SQLite migration inserting `en`, `ru`, `nl` labels for the ~200 most common everyday ingredients (`salt`, `garlic`, `onion`, `butter`, `egg`, `olive_oil`, \u2026) with `origin = 'human'` via `INSERT OR IGNORE`, so hubs never spend model tokens on basic terms and the gateway cache is not relied on for them (spec \u00a74.3)."], "acceptance": ["a fresh node labels `salt`/`garlic`/`onion` in all three languages with no model call (fake extractor records zero `translate_terms` calls); rows that already exist are untouched."]}, {"id": "RN-69", "title": "platform v1: registry, poller, index, search API", "size": "M", "body": ["New crate per spec \u00a75.3 without mail and signup: hub registry, federation poller with backoff comparing `(updated_at, content_hash)` and each translation's `(lang, updated_at)`, `recipes_index` + `translations_index`, FTS with one row per `(hub, recipe, lang)`, fork grouping by content hash, `GET /api/v1/search?lang=` returning the matched language's title/tags and `matched_lang`."], "acceptance": ["two hubs indexed from manifests; a translation added on a hub appears in `ru` search after the next poll with no recipe change; forks grouped; recipes and translations removed on the next poll after unpublishing."]}, {"id": "RN-70", "title": "platform search page on the apex", "size": "M", "body": ["Dependency-free UI reusing the hub's design tokens: search, hub directory, links to hubs."], "acceptance": ["a search in `ru` finds a Dutch recipe through its translation when the hub exposes it; works at 375 px."]}, {"id": "RN-71", "title": "Mail outbox and Resend adapter", "size": "S", "body": ["Outbox table, sender loop with backoff, suppression list, provider trait with a Resend implementation and a fake for tests."], "acceptance": ["retries and suppression covered by tests with the fake provider."]}, {"id": "RN-72", "title": "UI: client-side photo downscale before upload", "size": "S", "body": ["Resize photos to 1600 px in the browser before `POST /import/photo` so multi-photo imports stay under Cloudflare's 100 MB body cap."], "acceptance": ["six 12 MP photos upload under 100 MB total; server result unchanged."]}, {"id": "RN-73", "title": "Signup, magic-link owner login, provisioner, BYOK", "size": "L", "body": ["Spec \u00a74.6 and \u00a75.4. Hub: `GET /api/v1/auth/magic?token=<expires>.<nonce>.<mac>` (HMAC-SHA256 over `NODE_API_KEY`, 10-minute validity, single use, sets `node_session`, redirects to `/#/`) and owner-only `POST /api/v1/auth/magic-link`; `hubctl login-link`. Platform: accounts, email verification via the outbox, subdomain choice, provisioner on `control_net` with the Docker socket exposing `create/remove/rotate-key/login-link`, \"email me a sign-in link\" for existing owners, hub-owner model keys stored in the gateway. `NODE_API_KEY` stays the master secret and is never rotated for login."], "acceptance": ["end to end on the VPS: email \u2192 subdomain \u2192 running hub \u2192 signed in through the emailed link with the key untouched; expired, tampered and reused links answer 401; MCP clients keep working throughout."]}, {"id": "RN-21", "title": "Lossy WebP covers", "size": "S/M", "body": ["Covers are lossless today (about 1 MB for a 1200 px image). Decide between a", "lower max width, a lossy encoder via `libwebp` bindings, or keeping lossless."], "acceptance": ["a BBC Good Food import stores a cover under 200 KB, or the decision is recorded in `docs/ARCHITECTURE_AND_SCHEMAS.md`."]}, {"id": "RN-24", "title": "Mealie backup against a real archive", "size": "S", "body": ["Field names in `recipe-scraper/src/mealie.rs` follow Mealie's table names from memory."], "acceptance": ["a real Mealie 1.x backup imports with zero `errors`."]}, {"id": "RN-25", "title": "MCP resources", "size": "M", "body": ["Expose `recipe://{id}` and `recipe://manifest` as MCP resources next to the tools."], "acceptance": ["`resources/list` and `resources/read` work over stdio in `crates/recipe-mcp/tests/server.rs`."]}, {"id": "RN-28", "title": "Federation auth and rate limiting", "size": "M", "body": ["Federation endpoints are public by design but unthrottled."], "acceptance": ["tower-http rate limit on `/api/v1/federation/*`; documented in `docs/MCP_AND_API_SPEC.md`."]}, {"id": "RN-30", "title": "Backup and restore of the node", "size": "M", "body": ["Export the SQLite file plus images as a zip and import it back. Required for the hosted platform (spec \u00a74.7): adds `GET /api/v1/export` used by the nightly backup job."], "acceptance": ["round trip preserves ids, hashes, and covers."]}, {"id": "RN-31", "title": "Idle memory measurement in CI", "size": "S", "body": ["The < 20 MB RSS goal has never been measured (sandbox blocked `ps`). Required for the hosted platform (spec \u00a77): sets hub density per VPS."], "acceptance": ["a script in `scripts/` prints RSS after startup and 50 requests; number recorded in README."]}]}, {"name": "In Progress", "stories": []}, {"name": "Review", "stories": []}, {"name": "Done", "stories": [{"id": "RN-66", "title": "llm-gateway v1: passthrough, hub tokens, usage", "size": "M", "body": ["New crate per spec \u00a75.2: Messages-format passthrough, token auth, usage rows, vendor key custody. No cache or quota yet.", "Done 2026-10-27: new crate `crates/llm-gateway` (lib + binary, same distroless image as the hub, `entrypoint: llm-gateway`). `POST /{anthropic|minimax}/v1/messages` authenticates the hub token (`x-api-key` or bearer; SHA-256 stored in `hubs.token_hash`), swaps it for the vendor key, drops hop-by-hop/credential headers, forwards the body unchanged, retries once on 5xx/429 or a connect error, caps two in-flight calls per hub, returns the vendor reply as is and upserts `usage_daily` (requests, tokens, cost from `model_prices`, 0 when unpriced). On `/anthropic` MiniMax models route to MiniMax, others to Anthropic. `stream: true` \u2192 501. Errors use the Messages error envelope. Admin API behind `GATEWAY_ADMIN_TOKEN`: `POST/GET /admin/hubs`, `GET /admin/usage?hub=&from=&to=`; CLI `add-hub`, `healthcheck`. Schema already carries the RN-68 quota/cache/BYOK columns. Deploy: compose service `llm-gateway` (64 MiB, read-only, admin port on 127.0.0.1:8090), `hubctl create` registers hubs at the gateway when `GATEWAY_ADMIN_TOKEN` is set and writes the hub token + `MINIMAX_ANTHROPIC_API_BASE=http://llm-gateway:8080/anthropic` instead of the vendor key. 13 Rust tests (fake vendors), 3 hubctl tests (fake gateway). End-to-end 2026-10-27: a local node with its model base pointed at the gateway imported a text recipe through MiniMax unchanged (201, 4 canonical ids) and the gateway recorded 1 request / 230 in / 293 out tokens for that hub."], "acceptance": ["a hub works unchanged with `MINIMAX_ANTHROPIC_API_BASE` pointed at the gateway; usage recorded per hub."]}, {"id": "RN-65", "title": "deploy/: Compose, Caddy, hubctl, backup job", "size": "M", "body": ["Files described in the spec \u00a73, \u00a74.7, \u00a75.5, \u00a75.6 plus a deployment how-to for one VPS behind Cloudflare.", "Done 2026-10-26: `deploy/` holds `hubctl` (Python stdlib: init, create, remove [--purge], list, status, rotate-key, login-link, backup <name|all> [--local|--keep-local], restore, upgrade), `compose.yml` (caddy-docker-proxy 2.11, `chefs_net` + internal `control_net`), `templates/Caddyfile.tmpl` (Cloudflare ranges as trusted proxies, `CF-Connecting-IP`, 110 MB bodies, access log drops `token`, `hub_common` snippet imported by the hub labels, TLS_MODE origin|off), `env.example`, `backup.sh` and `README.md` (DNS, Origin CA, firewall, install, R2 via rclone, restore, local dry run). Backups take a host-side `VACUUM INTO` until RN-30's export endpoint exists; \u00a74.5 steps 2 and 5 (gateway token, platform registration) wait for RN-66/RN-69; `login-link` mints RN-73 tokens (HMAC key = the NODE_API_KEY string). 17 unit tests with fake docker/rclone. Local Docker smoke 2026-10-26 with the current image: `create demo` routed by Host through Caddy (health 200, owner POST 201), MCP initialize through Caddy 200 `text/event-stream` with `Cache-Control: no-cache` and `X-Accel-Buffering: no` in 3 ms, SSRF guard 400 through the stack, backup archive holds the created recipe, container read-only / 128 MiB / 0.5 CPU / uid 65532 / `chefs_net` only, remove --purge clean. Not exercised here: Cloudflare, Origin CA and R2 upload (need a VPS)."], "acceptance": ["`hubctl create demo` brings up a routed hub on a fresh box; `hubctl backup demo` lands an archive in R2."]}, {"id": "RN-74", "title": "SSRF guard on user-supplied URL fetches", "size": "S", "body": ["Harden `recipe-scraper` (`RecipeImporter::import_url`, `fetch_bytes` for covers and JSON-LD images, used by `ImportService::import_url`): resolve the hostname first and refuse loopback, link-local incl. cloud metadata (`169.254.0.0/16`, `fe80::/10`), RFC 1918, CGNAT `100.64/10`, `fc00::/7`, multicast/unspecified addresses and any scheme other than `http`/`https`; re-check every redirect hop and connect to the checked address. A builder flag `allow_private_hosts` exists only for tests with local servers. Spec: `docs/SPEC-hosted-platform.md` \u00a76.", "Done 2026-10-26: new `recipe-scraper/src/ssrf.rs`. `UrlGuard` checks scheme (`http`/`https` only), literal IP hosts and every DNS answer for a hostname; `blocked_reason` classifies loopback, RFC 1918, CGNAT `100.64/10`, link-local `169.254/16` + `fe80::/10`, ULA `fc00::/7`, multicast, unspecified and reserved ranges, judging IPv4 embedded in IPv6 (mapped, NAT64, 6to4) as IPv4. The importer's reqwest client uses `GuardedResolver` (system lookup, every answer checked, connection pinned to the checked address) and `redirect_policy` (scheme + literal IP re-checked per hop, 10-hop limit); redirects reqwest will not follow (`file:`, `ftp:`) are refused explicitly. New `ScraperError::BlockedUrl` \u2192 HTTP 400 (`refusing to fetch \u2026`) and MCP invalid-input. `RecipeImporter::allow_private_hosts()` unlocks loopback/private/CGNAT/ULA for tests only, never link-local or multicast. Model client untouched (rig builds its own). 8 new tests (207 total), clippy and rustfmt clean."], "acceptance": ["tests show `http://169.254.169.254/`, `http://127.0.0.1:8080/`, `http://llm-gateway:8080/` and a public URL redirecting to a private address are refused with a clear error; public URLs still import; the model client is unaffected."]}, {"id": "RN-64", "title": "`NODE_PUBLIC_URL`, manifest `node_url`, translations in federation, SSE headers", "size": "S", "body": ["`NODE_PUBLIC_URL` surfaced as `node_url` in `GET /api/v1/federation/manifest`, its host added to the MCP allowlist by default. Manifest entries gain `translations: [{lang, origin, stale, updated_at}]` and `GET /api/v1/federation/recipes/{id}` returns `translations: [RecipeTranslation]`, because saving a translation never changes `updated_at`/`content_hash` and the aggregator must still notice it (spec \u00a74.4, `docs/MCP_AND_API_SPEC.md`). SSE responses on `/mcp` send `Cache-Control: no-cache` and `X-Accel-Buffering: no`.", "Done 2026-10-26: `NODE_PUBLIC_URL` (validated absolute http(s) URL, trailing slash dropped) is published as manifest `node_url`; the default `/mcp` allowlist is loopback plus the URL's `host[:port]` (`default_mcp_allowed_hosts_with`), an explicit `NODE_MCP_ALLOWED_HOSTS` still wins. `ManifestEntry.translations: [{lang, origin, stale, updated_at}]` comes from one join over public recipes; `GET /federation/recipes/{id}` returns `FederatedRecipe` (recipe flat + `translations: [RecipeTranslation]`). SSE headers: rmcp 3.6 already sends `Cache-Control: no-cache` and `X-Accel-Buffering: no` on every event stream, so a regression test pins it instead of new code. 11 new tests (199 total), clippy and rustfmt clean."], "acceptance": ["API tests: manifest lists a translation with its own `updated_at` after `PUT /recipes/{id}/translations/ru` without the recipe's `updated_at` changing; federated recipe carries it; public recipes only; allowlist derived from the URL."]}, {"id": "RN-63", "title": "Dockerfile, `healthcheck` subcommand and image publishing", "size": "S", "body": ["Multi-stage `Dockerfile` (rust:1.97-slim-bookworm \u2192 distroless `cc-debian12:nonroot`, BuildKit cache mounts, `.dockerignore`), new `node-server healthcheck [--port] [--host]` subcommand (`crates/node-server/src/health.rs`: raw loopback HTTP GET of `/api/v1/health`, 2 s timeout, exit 0/1, port from `NODE_PORT`), image env `NODE_HOST=0.0.0.0 NODE_PORT=8080 NODE_DATA_DIR=/data TOKIO_WORKER_THREADS=2`, `/data` owned by uid 65532, `.github/workflows/docker.yml` building and smoke-testing on main/PRs and publishing `v*` tags to `ghcr.io/watchcat/chefsprodigy` (`<version>`, `<major.minor>`, `latest`). README and CLAUDE.md document it.", "8 new tests in `crates/node-server/tests/healthcheck.rs` (healthy node, nothing listening, error status, wrong body, silent server timeout, CLI exit codes 0/1, `NODE_PORT` default); 188 tests total, clippy clean.", "Verified 2026-10-26 with a local `docker build` (arm64, 2m10s compile): container reported `healthy` after 9 s through its own probe; no `/bin/sh` in the image; process uid 65532; a recipe POST wrote to `/data` (201); `healthcheck --port 9` exited 1; image 13 MB compressed; 3.5 MiB RSS after a few requests. The first real GHCR publish happens on the first `v*` tag."], "acceptance": []}, {"id": "RN-62", "title": "UI: owner login and read-only mode for visitors", "size": "S", "body": ["The PWA now checks `GET /api/v1/auth/me` before rendering a route, presents a native owner-key login dialog backed by `POST /api/v1/auth/login`, and offers `POST /api/v1/auth/logout`. Visitors see only public recipes and no create/edit/delete/import/translation-correction controls; direct write routes render an owner-access prompt, real `401` responses open the same login dialog, and the recipe detail explains that uncached display-language translations appear after the owner has viewed the recipe. Owner sessions use the existing HttpOnly cookie and survive reloads.", "Verified in-browser 2026-10-24 via `scripts/devbuild.sh` against an isolated key-protected node: anonymous view contained only a public Dutch recipe, no write controls, a Russian cached-translation hint, and the protected `#/new` login prompt. After native-dialog sign-in, the session survived a reload, the owner saw the private recipe plus import/edit/delete controls, and logout restored public-only visitor mode."], "acceptance": []}, {"id": "RN-61", "title": "Owner vs. public reader authentication on the REST API", "size": "M", "body": ["`NODE_API_KEY` is the owner secret: `RequireOwner`/`OptionalOwner` extractors (bearer header or HttpOnly `node_session` cookie, constant-time compare), `POST /auth/login|logout`, `GET /auth/me`. Writes, cover upload, translation edits and all imports are owner-only (401); anonymous callers see public recipes only (listings, counts, shopping lists, 404 on private ids) and get cached translations/labels without live model calls. Without a key the node is single-user and warns at startup. 6 new tests."], "acceptance": []}, {"id": "RN-60", "title": "Backfill source language for existing recipes", "size": "S", "body": ["Offline detector (`langdetect.rs`: Cyrillic letter signals for ru/uk, stopword scoring for en/nl/de/fr/es/it) applied at import time and by `backfill-language` (CLI + background pass at `serve` startup); the model is asked only when the heuristic is unsure; backfill never touches `updated_at`/`content_hash`. 7 new tests."], "acceptance": []}, {"id": "RN-59", "title": "UI: translated recipe content and corrections", "size": "M", "body": ["Library, recipe detail, and shopping-list requests now send the selected UI language as `lang`. Localized titles, tags, ingredient labels, and shopping labels render from the server response. Recipe detail shows translation provenance, permits a source-wording toggle, displays a translation loading state, and offers `#/recipe/{id}/translation` to save ordered human wording corrections through the documented translation endpoint; retained human corrections show a stale-source hint after source edits.", "Verified in-browser 2026-10-24 via `scripts/devbuild.sh`: a Dutch `Hollandse stamppot` card rendered in Russian, opened with its human-translation provenance, toggled to its Dutch source and back, and saved a corrected Russian ingredient. The correction survived a reload; after a source-recipe `PUT`, it remained visible with the Russian stale-source hint. Browser console had no errors.", "Follow-up verified in-browser 2026-10-24 after updating the static PWA shell: the saved Torchiette recipe rendered its Russian title, ingredient wording, and method after selecting Russian, and remained Russian after reload with `html[lang=\"ru\"]` and `localStorage[\"ui.lang\"] = \"ru\"`."], "acceptance": []}, {"id": "RN-57", "title": "MCP: language parameter on tools", "size": "S", "body": ["`search_recipes`, `get_recipe_details`, `build_smart_shopping_list` accept `language`; end-to-end stdio test with a fake translator."], "acceptance": []}, {"id": "RN-56", "title": "Backend: localized canonical ingredient labels", "size": "S", "body": ["`canonical_terms` cache + `TranslationService::labels` (batches of 100, humanized fallback, no-LLM safe); `canonical_label` on ingredients of localized recipes and on shopping-list lines (`?lang=`/`Accept-Language`)."], "acceptance": []}, {"id": "RN-55", "title": "Backend: search across translations", "size": "S", "body": ["`q` matches `recipes_fts` and `translations_fts` (union, best rank, one row per recipe) in both search and count; `lang` on `GET /recipes` makes summaries use an existing translation and adds `translation_lang`."], "acceptance": []}, {"id": "RN-58", "title": "UI: message bundles and language switcher", "size": "M", "body": ["The embedded PWA now ships parity-checked `en`, `ru`, and `nl` message bundles, with bundle-backed static UI text, an English fallback, and a header switcher persisted in `localStorage[\"ui.lang\"]`. The active language updates `<html lang>` and drives `Intl` number, unit, duration, and timer formatting; the static PWA shell caches all three bundles.", "Verified in-browser 2026-10-24 via `scripts/devbuild.sh`: the switcher changed the live library from English to Russian and Dutch, set `html[lang]` to `ru`/`nl`, persisted through a reload, and returned to unchanged English. `scripts/i18n-check.py` passed bundle parity and renderer-string checks."], "acceptance": []}, {"id": "RN-54", "title": "Backend: translation store and service", "size": "M", "body": ["`recipe_translations` + `translations_fts` (triggers) + `canonical_terms` tables; `TranslationService` translates lazily on `GET /recipes/{id}?lang=` (or `Accept-Language`), caches per language, coalesces concurrent requests, regenerates stale machine translations, keeps human ones (`PUT/DELETE /recipes/{id}/translations/{lang}`), validates reply lengths and falls back to the source on failure. `GET /i18n/languages`. 20 new tests."], "acceptance": []}, {"id": "RN-53", "title": "Backend: source language on recipes", "size": "S", "body": ["`recipes.language` (migration `20261024000001_i18n.sql`), normalized BCP-47 primary subtag; detected from JSON-LD `inLanguage` / `<html lang>`, LLM drafts (`language` field), photo extraction; exposed on recipes and summaries; settable via create/update."], "acceptance": []}, {"id": "RN-52", "title": "Fix editor heading collapsing to one letter per line", "size": "S", "body": ["Bug: on `#/recipe/{id}/edit` the title and eyebrow rendered one character per line. The heading grid's cover column was `auto`, so the cover image's 1200 px natural width took the whole row and left the title track at 0 px. Fixed 2026-10-24 with `fit-content(14rem)` for that column and a capped preview width; verified with and without a cover and at 375 px."], "acceptance": []}, {"id": "RN-51", "title": "Verify photo import with real photos", "size": "S", "body": ["Verified 2026-10-23 with MiniMax-M3: a Marley Spoon card (front with hero photo + back with Dutch text) imports with the full title, 12 ingredients, 6 steps with timers, servings 2, cook 30 min, and the front photo as cover; an English card (\"Willow Chicken in Black Bean Sauce\") also imported. Fixes found on the way: `classification`/`type` keys for photo kinds, notes mentioning a dish photo promote a text page to cover, equipment filtered from ingredients, nested `times` objects, synthesized title when the card side has no title.", "Known limits: covers are lossless WebP (~1.2 MB for a card front, see RN-21); pasta name sometimes misread (\"torchiatelle\")."], "acceptance": []}, {"id": "RN-47", "title": "Dev tooling: devbuild.sh, .env, per-toolchain target dirs", "size": "S", "body": ["`scripts/devbuild.sh` builds, runs, seeds and opens the browser; loads `.env` (template `.env.example`, git-ignored); uses `target/rustc-<version>/` per toolchain and refuses a stale `DEVELOPER_DIR`."], "acceptance": []}, {"id": "RN-48", "title": "MiniMax-M3 default and lenient model-reply parsing", "size": "M", "body": ["`LLM_MODEL=minimax/MiniMax-M3` via `.env`; rig reads vendor variables unless `LLM_API_KEY` overrides. Replies with missing/renamed fields, string ranges, time phrases, decimal commas and unit spellings now parse; gateway errors and rejected replies are logged."], "acceptance": []}, {"id": "RN-49", "title": "Navbar logo and PWA icons", "size": "S", "body": ["PNG mark at 128/192/512 px plus Apple touch icon; favicon, manifest icons and service-worker shell updated."], "acceptance": []}]}]};
const GENERATED = "2026-10-27";
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inline = s => s.split('`').map((p,i) => i%2 ? `<code>${esc(p)}</code>` : esc(p)).join('');
const key = n => n.toLowerCase().replace(/ /g,'-');
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg, err){ toastEl.textContent = msg; toastEl.className = 'show' + (err ? ' err' : ''); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.className = '', err ? 4000 : 1500); }

function render(){
  const total = board.columns.reduce((n,c) => n + c.stories.length, 0);
  document.getElementById('mode').textContent = LIVE ? 'live · drag to move' : 'static export';
  document.getElementById('mode').className = 'badge' + (LIVE ? ' live' : '');
  document.getElementById('meta').textContent = `${total} stories · ${LIVE ? 'docs/KANBAN.md' : 'generated ' + GENERATED + ' from docs/KANBAN.md'}`;
  document.getElementById('board').innerHTML = board.columns.map(col => `
    <section class="col col-${key(col.name)}" data-col="${esc(col.name)}" aria-label="${esc(col.name)}">
      <h2>${esc(col.name)} <span class="count">${col.stories.length}</span></h2>
      <div class="cards">${col.stories.map(s => `
        <article class="card" data-id="${s.id}" ${LIVE ? 'draggable="true"' : ''} data-search="${esc([s.id, s.title, ...s.body, ...s.acceptance].join(' ').toLowerCase())}">
          <header><span class="id">${s.id}</span>${s.size ? `<span class="size size-${s.size.split('/')[0]}">${esc(s.size)}</span>` : ''}</header>
          <h3>${inline(s.title)}</h3>
          ${s.body.map(b => `<p>${inline(b)}</p>`).join('')}
          ${s.acceptance.length ? `<details><summary>Acceptance</summary><ul>${s.acceptance.map(a => `<li>${inline(a)}</li>`).join('')}</ul></details>` : ''}
        </article>`).join('') || '<p class="empty">Nothing here</p>'}</div>
    </section>`).join('');
  applyFilter();
  if (LIVE) wireDnd();
}

const q = document.getElementById('q');
function applyFilter(){
  const t = q.value.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('hidden', !!t && !c.dataset.search.includes(t)));
  document.querySelectorAll('.col').forEach(col => { col.querySelector('.count').textContent = col.querySelectorAll('.card:not(.hidden)').length; });
}
q.addEventListener('input', applyFilter);

// ---- drag and drop (live mode)
let dragId = null;
function clearMarks(){ document.querySelectorAll('.drop-before,.drop-after').forEach(c => c.classList.remove('drop-before','drop-after')); document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over')); }
function wireDnd(){
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('dragstart', e => { dragId = card.dataset.id; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); clearMarks(); dragId = null; });
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => {
      if (!dragId) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      clearMarks(); col.classList.add('over');
      const target = e.target.closest('.card');
      if (target && target.dataset.id !== dragId) {
        const r = target.getBoundingClientRect();
        target.classList.add(e.clientY < r.top + r.height/2 ? 'drop-before' : 'drop-after');
      }
    });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) clearMarks(); });
    col.addEventListener('drop', async e => {
      e.preventDefault();
      const id = dragId || e.dataTransfer.getData('text/plain');
      const to = col.dataset.col;
      const cards = [...col.querySelectorAll('.card')].filter(c => c.dataset.id !== id);
      const target = e.target.closest('.card');
      let index = cards.length;
      if (target && target.dataset.id !== id) {
        const r = target.getBoundingClientRect();
        index = cards.indexOf(target) + (e.clientY < r.top + r.height/2 ? 0 : 1);
      }
      clearMarks();
      await move(id, to, index);
    });
  });
}
async function move(id, to, index){
  try {
    const res = await fetch('/api/move', { method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({ id, to, index }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    board = data; render(); toast(`${id} → ${to} · saved to KANBAN.md`);
  } catch (err) { toast('Move failed: ' + err.message, true); }
}
if (LIVE) {
  // Pick up edits made to the Markdown file in an editor.
  setInterval(async () => { try { const r = await fetch('/api/board'); const d = await r.json(); if (JSON.stringify(d) !== JSON.stringify(board)) { board = d; render(); } } catch {} }, 3000);
}
render();
</script>
